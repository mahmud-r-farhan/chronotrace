name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-daemon:
    name: Build Daemon (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: chronotrace-daemon-windows-amd64.exe
          - goos: linux
            goarch: amd64
            output: chronotrace-daemon-linux-amd64
          - goos: linux
            goarch: arm64
            output: chronotrace-daemon-linux-arm64
          - goos: darwin
            goarch: amd64
            output: chronotrace-daemon-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: chronotrace-daemon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build daemon
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-s -w -X main.version=${{ github.sha }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H windowsgui"
          fi
          go build \
            -ldflags="$LDFLAGS" \
            -o build/${{ matrix.output }} \
            ./daemon/cmd/chronotrace-daemon

      - name: Vet
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          cd daemon && go vet ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: build/${{ matrix.output }}
