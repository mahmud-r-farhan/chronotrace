name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-daemon:
    name: Build Daemon (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: chronotrace-daemon-windows-amd64.exe
          - goos: linux
            goarch: amd64
            output: chronotrace-daemon-linux-amd64
          - goos: linux
            goarch: arm64
            output: chronotrace-daemon-linux-arm64
          - goos: darwin
            goarch: amd64
            output: chronotrace-daemon-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: chronotrace-daemon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build daemon
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build
          LDFLAGS="-s -w -X main.version=${{ github.sha }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H windowsgui"
          fi
          cd daemon
          go build \
            -ldflags="$LDFLAGS" \
            -o ../build/${{ matrix.output }} \
            ./cmd/chronotrace-daemon

      - name: Vet
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          cd daemon && go vet ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: build/${{ matrix.output }}

  test:
    name: Vet & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install GUI system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Prepare frontend embed placeholder
        run: |
          mkdir -p gui/frontend/dist
          echo '<!-- placeholder for go:embed -->' > gui/frontend/dist/index.html

      - name: Check gofmt
        run: |
          UNFORMATTED=$(gofmt -l daemon gui)
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: |
          cd daemon && go vet ./... && cd ..
          cd gui && go vet ./...

      - name: Test daemon
        run: |
          cd daemon
          go test -v ./... 2>&1 | tee /tmp/daemon-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            {
              echo '### Daemon test failures'
              echo '```'
              grep -E '^(=== RUN|--- FAIL|--- PASS|FAIL|ok |panic|.*\.go:[0-9]+)' /tmp/daemon-test.log | tail -n 150
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Test GUI
        run: |
          cd gui
          go test -v ./... 2>&1 | tee /tmp/gui-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            {
              echo '### GUI test failures'
              echo '```'
              grep -E '^(=== RUN|--- FAIL|--- PASS|FAIL|ok |panic|.*\.go:[0-9]+)' /tmp/gui-test.log | tail -n 150
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
