name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ── Daemon cross-compilation ──────────────────────────────────
  daemon:
    name: Daemon (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: chronotrace-daemon-windows-amd64.exe
          - goos: linux
            goarch: amd64
            output: chronotrace-daemon-linux-amd64
          - goos: linux
            goarch: arm64
            output: chronotrace-daemon-linux-arm64
          - goos: darwin
            goarch: amd64
            output: chronotrace-daemon-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: chronotrace-daemon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build daemon
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build
          LDFLAGS="-s -w -X main.version=${{ github.ref_name }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H windowsgui"
          fi
          cd daemon
          go build \
            -ldflags="$LDFLAGS" \
            -o ../build/${{ matrix.output }} \
            ./cmd/chronotrace-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: build/${{ matrix.output }}

  # ── GUI — Windows ─────────────────────────────────────────────
  gui-windows:
    name: GUI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps and build dist
        working-directory: gui/frontend
        run: |
          npm install
          npm run build

      - name: Build Windows GUI Binary
        working-directory: gui
        run: |
          go build -tags "desktop,production" -ldflags="-s -w -H windowsgui -X main.version=${{ github.ref_name }}" -o ../build/ChronoTrace.exe .

      - name: Build Windows Daemon
        working-directory: daemon
        run: |
          go build -ldflags="-s -w -H windowsgui -X main.version=${{ github.ref_name }}" -o ../build/chronotrace-daemon.exe ./cmd/chronotrace-daemon

      - name: Package Windows 1-Click Bundle
        run: |
          mkdir -p package-windows
          cp build/ChronoTrace.exe package-windows/
          cp build/chronotrace-daemon.exe package-windows/
          cp gui/build/windows/icon.ico package-windows/
          cp scripts/install-windows.bat package-windows/
          cp scripts/install-windows.ps1 package-windows/
          cp README.md package-windows/
          Compress-Archive -Path package-windows/* -DestinationPath build/ChronoTrace-Windows-x64-Setup.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ChronoTrace-Windows-x64-Setup.zip
          path: build/ChronoTrace-Windows-x64-Setup.zip

  # ── GUI — Linux ───────────────────────────────────────────────
  gui-linux:
    name: GUI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Install frontend deps and build dist
        working-directory: gui/frontend
        run: |
          npm install
          npm run build

      - name: Build Linux GUI Binary
        working-directory: gui
        run: |
          go build -tags "desktop,production" -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../build/ChronoTrace .

      - name: Build Linux Daemon
        working-directory: daemon
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../build/chronotrace-daemon ./cmd/chronotrace-daemon

      - name: Package Linux Bundle
        run: |
          mkdir -p package-linux
          cp build/ChronoTrace package-linux/
          cp build/chronotrace-daemon package-linux/
          cp gui/build/linux/icon.png package-linux/
          cp scripts/install-linux.sh package-linux/
          cp README.md package-linux/
          tar -czvf build/ChronoTrace-Linux-x64.tar.gz -C package-linux .

      - uses: actions/upload-artifact@v4
        with:
          name: ChronoTrace-Linux-x64.tar.gz
          path: build/ChronoTrace-Linux-x64.tar.gz

  # ── GUI — macOS ───────────────────────────────────────────────
  gui-macos:
    name: GUI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps and build dist
        working-directory: gui/frontend
        run: |
          npm install
          npm run build

      - name: Build macOS Daemon
        working-directory: daemon
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../build/chronotrace-daemon ./cmd/chronotrace-daemon

      - name: Build macOS GUI
        working-directory: gui
        run: |
          go build -tags "desktop,production" -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../build/ChronoTrace .

      - name: Package macOS Bundle
        run: |
          mkdir -p package-macos
          cp build/ChronoTrace package-macos/
          cp build/chronotrace-daemon package-macos/
          cp gui/build/darwin/icon.png package-macos/
          cp scripts/install-macos.sh package-macos/
          cp README.md package-macos/
          zip -r build/ChronoTrace-macOS-Universal.zip package-macos/

      - uses: actions/upload-artifact@v4
        with:
          name: ChronoTrace-macOS-Universal.zip
          path: build/ChronoTrace-macOS-Universal.zip

  # ── Create GitHub Release ─────────────────────────────────────
  release:
    name: Create Release
    needs: [daemon, gui-windows, gui-linux, gui-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            CHANGES=$(git log ${PREV}..HEAD --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges | head -30)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ChronoTrace ${{ github.ref_name }}"
          body: |
            ## ChronoTrace ${{ github.ref_name }} — Privacy-First Screen Time Tracker

            ### ✨ 1-Click Install Packages (Recommended)
            - **🪟 Windows (x64)**: [`ChronoTrace-Windows-x64-Setup.zip`](https://github.com/mahmud-r-farhan/chronotrace/releases/download/${{ github.ref_name }}/ChronoTrace-Windows-x64-Setup.zip) — Extract and double-click `install-windows.bat`.
            - **🐧 Linux (x64)**: [`ChronoTrace-Linux-x64.tar.gz`](https://github.com/mahmud-r-farhan/chronotrace/releases/download/${{ github.ref_name }}/ChronoTrace-Linux-x64.tar.gz) — Extract and run `./install-linux.sh`.
            - **🍎 macOS (Universal)**: [`ChronoTrace-macOS-Universal.zip`](https://github.com/mahmud-r-farhan/chronotrace/releases/download/${{ github.ref_name }}/ChronoTrace-macOS-Universal.zip) — Extract and run `./install-macos.sh`.

            ### 📦 Standalone Headless Daemon Binaries
            - `chronotrace-daemon-windows-amd64.exe`
            - `chronotrace-daemon-linux-amd64`
            - `chronotrace-daemon-linux-arm64`
            - `chronotrace-daemon-darwin-amd64`
            - `chronotrace-daemon-darwin-arm64`

            ### 📝 What's Changed
            ${{ steps.changelog.outputs.CHANGES }}

            ---
            🔒 **100% Offline**: All metrics stay locally on your machine in SQLite.  
            ⚡ **Resource Benchmark**: Under **15MB RAM** & **~0% CPU**.
          files: release-assets/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
